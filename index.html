<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Extracteur Pari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --paper: oklch(99% 0.003 255); --ink: oklch(16% 0.01 255); --ink-2: oklch(42% 0.01 255); --signal: oklch(84% 0.17 95);
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.45 var(--font); }
main { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 32px; display: grid; gap: 20px; }
.mark { font: 800 22px/1 var(--font); text-transform: lowercase; letter-spacing: -0.02em; border-bottom: 2px solid var(--ink); padding-bottom: 20px; }
h1 { margin: 0; font: 800 44px/0.95 var(--font); letter-spacing: -0.03em; text-transform: lowercase; }
label { display: grid; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
input { font: 800 26px var(--font); color: var(--ink); background: transparent; border: 0; border-bottom: 3px solid var(--ink); padding: 6px 0; border-radius: 0; width: 100%; }
button { font: 700 16px/1 var(--font); text-transform: lowercase; background: var(--ink); color: var(--paper); border: 2px solid var(--ink); padding: 14px 18px; cursor: pointer; justify-self: start; }
button:hover { background: var(--signal); color: var(--ink); }
button:disabled { opacity: 0.5; cursor: default; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
#err { margin: 0; font-weight: 700; }
#err:not(:empty) { background: var(--signal); padding: 6px 10px; justify-self: start; }
p.muted { margin: 0; color: var(--ink-2); font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="mark">extracteur pari</div>
  <h1>page protégée.</h1>
  <form id="f" onsubmit="return false">
    <label for="pw">mot de passe<input id="pw" type="password" autocomplete="current-password" autofocus></label>
  </form>
  <button type="button" id="go">déverrouiller</button>
  <p id="err" role="alert"></p>
  <p class="muted">Les cotes sont chiffrées : sans le bon mot de passe, cette page ne contient que des données illisibles.</p>
</main>
