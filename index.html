<style>
/* Couleurs : la palette choisie sur la page (bouton « couleurs »), même source : utils/palettes.py */
:root { --font: "Archivo", "Helvetica Neue", Arial, sans-serif; }
:root, [data-palette="signal"] {
  --paper: oklch(99% 0.003 255); --paper-2: oklch(96.5% 0.003 255);
  --ink: oklch(16% 0.01 255); --ink-2: oklch(42% 0.01 255);
  --rule: oklch(86% 0.004 255); --rule-faint: oklch(93% 0.004 255);
  --signal: oklch(84% 0.17 95); --on-signal: oklch(16% 0.01 255);
  color-scheme: light;
}
[data-palette="pelouse"] {
  --paper: oklch(98.5% 0.008 145); --paper-2: oklch(95.5% 0.014 145);
  --ink: oklch(23% 0.045 155); --ink-2: oklch(42% 0.035 155);
  --rule: oklch(85% 0.02 150); --rule-faint: oklch(92.5% 0.014 150);
  --signal: oklch(80% 0.17 140); --on-signal: oklch(23% 0.045 155);
  color-scheme: light;
}
[data-palette="ardoise"] {
  --paper: oklch(97.5% 0.008 245); --paper-2: oklch(94.5% 0.012 245);
  --ink: oklch(25% 0.06 260); --ink-2: oklch(44% 0.04 255);
  --rule: oklch(84% 0.02 250); --rule-faint: oklch(91.5% 0.014 250);
  --signal: oklch(79% 0.11 225); --on-signal: oklch(25% 0.06 260);
  color-scheme: light;
}
[data-palette="brique"] {
  --paper: oklch(97.5% 0.014 75); --paper-2: oklch(94.5% 0.02 70);
  --ink: oklch(25% 0.035 40); --ink-2: oklch(44% 0.04 45);
  --rule: oklch(85% 0.025 65); --rule-faint: oklch(92% 0.018 70);
  --signal: oklch(73% 0.15 42); --on-signal: oklch(20% 0.03 40);
  color-scheme: light;
}
[data-palette="nuit"] {
  --paper: oklch(19% 0.012 260); --paper-2: oklch(24% 0.014 260);
  --ink: oklch(94% 0.006 260); --ink-2: oklch(74% 0.012 260);
  --rule: oklch(36% 0.015 260); --rule-faint: oklch(25% 0.013 260);
  --signal: oklch(86% 0.17 95); --on-signal: oklch(19% 0.012 260);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.45 var(--font); }
main { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 32px; display: grid; gap: 20px; }
.mark { font: 800 22px/1 var(--font); text-transform: lowercase; letter-spacing: -0.02em; border-bottom: 2px solid var(--ink); padding-bottom: 20px; }
h1 { margin: 0; font: 800 44px/0.95 var(--font); letter-spacing: -0.03em; text-transform: lowercase; }
label { display: grid; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
input { font: 800 26px var(--font); color: var(--ink); background: transparent; border: 0; border-bottom: 3px solid var(--ink); padding: 6px 0; border-radius: 0; width: 100%; }
button { font: 700 16px/1 var(--font); text-transform: lowercase; background: var(--ink); color: var(--paper); border: 2px solid var(--ink); padding: 14px 18px; cursor: pointer; justify-self: start; }
button:hover { background: var(--signal); color: var(--on-signal); }
button:disabled { opacity: 0.5; cursor: default; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
#err { margin: 0; font-weight: 700; }
#err:not(:empty) { background: var(--signal); color: var(--on-signal); padding: 6px 10px; justify-self: start; }
p.muted { margin: 0; color: var(--ink-2); font-size: 14px; }
</style>
</head>

  <p id="err" role="alert"></p>

</main>

async function unlock() {
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; go.textContent = 'déchiffrement…'; err.textContent = '';
  try {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(D.salt), iterations: D.iter, hash: 'SHA-256'},
